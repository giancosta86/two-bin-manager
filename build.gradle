buildscript {
    repositories {
        //TODO! Del this!
        mavenLocal()

        mavenCentral()
    }

    dependencies {
        classpath 'info.gianlucacosta.aurora:aurora:10.0.0-SNAPSHOT'
        classpath 'com.github.maiflai:gradle-scalatest:0.14'
    }
}


apply plugin: 'scala'
apply plugin: 'application'

apply plugin: 'com.github.maiflai.scalatest'

apply plugin: 'info.gianlucacosta.aurora'


group 'info.gianlucacosta.twobinpack'
archivesBaseName = 'twobinmanager'
version = '4.0.0-SNAPSHOT'


description = 'Management application for two-dimensional packing'


mainClassName = "info.gianlucacosta.twobinmanager.App"


dependencies {
    compile 'org.scala-lang:scala-library:2.11.8'

    compile 'org.hsqldb:hsqldb:2.3.4'

    compile 'info.gianlucacosta.twobinpack:twobinmanager-sdk:4.0.0-SNAPSHOT'
    compile 'info.gianlucacosta.helios:helios-jpa:2.0.0-SNAPSHOT'
    compile 'info.gianlucacosta.helios:helios-reflection:2.0.0-SNAPSHOT'

    testCompile 'org.scalatest:scalatest_2.11:2.2.6'
    testRuntime 'org.pegdown:pegdown:1.6.0'
}


aurora {
    gitHubUser = 'giancosta86'

    author {
        name = 'Gianluca Costa'
        email = 'gianluca@gianlucacosta.info'
        url = 'http://gianlucacosta.info/'
    }
}